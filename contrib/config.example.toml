# Copy to $XDG_CONFIG_HOME/npd/config.toml

[server]
url = "https://music.example.com"
username = "me"
# One of:
password_command = "pass show navidrome"
# password = "..."
# token = "..."            # from `npd token`; md5(password + salt)
# salt = "..."
# api_key = "..."          # OpenSubsonic API key; replaces username/password

[mpd]
bind = ["127.0.0.1:6600"]
# Unix socket; ~ and $XDG_RUNTIME_DIR are expanded. MPD's usual path lets
# clients that look for it (mpd-mpris) connect without flags.
# socket = "$XDG_RUNTIME_DIR/mpd/socket"

[paths]
# state_dir = "/home/me/.local/state/npd"   # library mirror; default $XDG_STATE_HOME/npd

[playlists]
# favorites = "Favorites"   # virtual playlist of starred songs; "" disables
# poll_interval = 120       # seconds between checks for changes made elsewhere; 0 disables

[playback]
# Play from a mounted copy of the library instead of streaming. Its layout
# must match `mpc ls` (the server paths minus their common prefix). Songs
# missing locally still stream.
# local_root = "/mnt/music"
# scrobble = true            # report plays to the server
# Share the play queue with other devices (phone apps, another npd) through
# the server: saved on pause/stop, and another device's queue is taken
# over when you resume here.
# handoff = false
# Transcode on the server: "raw" plays originals. Use "opus" (gapless), not
# MP3, if the server has an Opus transcoding set up.
# format = "raw"
# max_bitrate = 0            # kbps; 0 = server default

[cache]
# dir = "/home/me/.cache/npd"   # default $XDG_CACHE_HOME/npd
# art_size = 512                # cover art cache, MiB; 0 disables
# Audio cache, in the [playback] format. Cached songs are used whenever
# present; these control what gets downloaded:
# audio_size = 2048             # MiB, not counting pinned favorites; 0 disables
# prefetch = 0                  # songs ahead of the current one; 0 = stream only
# pin_favorites = false         # keep every starred song cached
